<!doctype html>
<html lang="pt-br" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domu Tech | Disparos no WhatsApp oficial e criação de sites</title>
    <meta
      name="description"
      content="Domu Tech é a central de soluções digitais do seu negócio: disparos e atendimento com IA no WhatsApp oficial da Meta com o Domu Painel e criação de sites com o Domu Studio."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Domu Tech | Tecnologia que conecta, soluções que geram resultados" />
    <meta
      property="og:description"
      content="Disparos e atendimento com IA no WhatsApp oficial e criação de sites. Tudo em um só ecossistema."
    />
    <meta property="og:image" content="/logo_nova.png" />
    <meta property="og:site_name" content="Domu Tech" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Domu Tech | Tecnologia que conecta, soluções que geram resultados" />
    <meta
      name="twitter:description"
      content="Disparos e atendimento com IA no WhatsApp oficial e criação de sites. Tudo em um só ecossistema."
    />
    <meta name="twitter:image" content="/logo_nova.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("domu_theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
